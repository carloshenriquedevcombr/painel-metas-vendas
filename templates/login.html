<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Evolução Consultores</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 class="login-title">Acesso Restrito</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-msg">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" name="username" placeholder="Seu usuário (ex: admin)" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" name="password" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn-primary">
                Entrar no Sistema
            </button>
        </form>

        <p class="footer-text">
            Painel de Metas de Vendas &copy; 2026 · dados fictícios
        </p>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
