{% extends "base.html" %}
{% set active_page = 'usuarios' %}

{% block titulo_pagina %}Controle de Acessos{% endblock %}

{% block content %}
<section class="secao-ativa">
    
    <div class="table-container">
        <div class="table-header" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; align-items: center;">
            <h2><i class="fa-solid fa-users-gear" style="color: var(--cor-primaria); margin-right: 8px;"></i> Equipe do Sistema</h2>
            
            <div style="display:flex; gap:10px; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; border: 1px solid #ccc; border-radius: 20px; padding: 5px 15px; background: var(--input-bg);">
                    <i class="fa-solid fa-magnifying-glass" style="color: #888;"></i>
                    <input type="text" id="busca-usuario" placeholder="Pesquisar usuário..." onkeyup="filtrarUsuarios()" style="border: none; outline: none; padding: 5px 10px; background: transparent;">
                </div>
                
                <button onclick="verLogs('usuario')" class="btn-primary" style="background:#f39c12; padding: 8px 20px; border-radius: 20px;" title="Ver Histórico de Acessos">
                    <i class="fa-solid fa-clock-rotate-left"></i> Histórico
                </button>
                
                <button onclick="abrirModalUsuario()" class="btn-primary" style="background: var(--cor-primaria); padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(30, 64, 175,0.3);">
                    <i class="fa-solid fa-user-plus"></i> Novo Usuário
                </button>
            </div>
        </div>
        
        <div class="scroll-table" style="margin-top: 15px;">
            <table id="tabela-usuarios" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="color: var(--cor-primaria);">
                        <th>Nome Completo</th>
                        <th>Login</th>
                        <th>Cargo</th>
                        <th>Nível</th>
                        <th>Status</th>
                        <th style="text-align:right;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

</section>

<div id="modal-usuario" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 650px;">
        <div class="modal-header">
            <h2 id="titulo-form-usuario"><i class="fa-solid fa-user-plus"></i> Cadastrar Usuário</h2>
            <button onclick="fecharModalUsuario()" class="btn-close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <form id="form-novo-usuario">
            <input type="hidden" id="user-id"> 
            
            <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="input-group" style="grid-column: 1 / -1;">
                    <label>Nome Completo</label>
                    <input type="text" id="user-nome" required placeholder="Ex: Ana Exemplo">
                </div>
                
                <div class="input-group">
                    <label>Cargo</label>
                    <select id="user-cargo" required>
                        <option value="Consultor(a) Júnior">Consultor(a) Júnior</option>
                        <option value="Consultor(a) Pleno">Consultor(a) Pleno</option>
                        <option value="Consultor(a) Sênior">Consultor(a) Sênior</option>
                        <option value="Supervisor(a)">Supervisor(a)</option>
                        <option value="Gerente">Gerente</option>
                        <option value="ADM">ADM</option>
                        <option value="Diretoria">Diretoria</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Nível de Sistema</label>
                    <select id="user-role" required>
                        <option value="consultor">Consultor (Vê apenas seus dados)</option>
                        <option value="editor">Editor (Gerencia Equipe)</option>
                        <option value="admin">Admin (Acesso Total)</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Login de Acesso</label>
                    <input type="text" id="user-login" required placeholder="Ex: ana.exemplo">
                </div>
                
                <div class="input-group">
                    <label>Senha <small style="color:#888; font-weight:normal;">(Vazio mantém atual)</small></label>
                    <input type="password" id="user-pass" placeholder="***">
                </div>
            </div>
            
            <div class="form-actions" style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px;">
                <button type="button" class="btn-cancel" onclick="fecharModalUsuario()" style="border-radius: 20px; padding: 10px 25px;">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
                <button type="submit" class="btn-save" id="btn-salvar-usuario" style="border-radius: 20px; background: var(--title-color); color: white; border: none; padding: 10px 35px; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(30, 64, 175,0.3);">
                    <i class="fa-solid fa-check"></i> Salvar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/usuarios.js"></script>
{% endblock %}
